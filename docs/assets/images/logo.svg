<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F51B5"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Wave (wave ecosystem brand) -->
  <path d="M 112 220 Q 176 160 240 220 T 368 220 T 400 220"
        fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
  <path d="M 112 270 Q 176 210 240 270 T 368 270 T 400 270"
        fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>

  <!-- Bidirectional arrows (BiDi = bidirectional) -->
  <g transform="translate(256, 380)" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <!-- Left arrow -->
    <line x1="-60" y1="0" x2="60" y2="0"/>
    <polyline points="-48,-16 -64,0 -48,16"/>
    <!-- Right arrow -->
    <polyline points="48,-16 64,0 48,16"/>
  </g>
</svg>
